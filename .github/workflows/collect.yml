name: collect
on:
  schedule:
    - cron: '7 */3 * * *'   # 3시간마다
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node collect.js
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - name: commit
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
